<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de vídeo</title>
    <link href="css/estilos.css" rel="stylesheet">
    <link href="img/favicon-2.png" rel="icon" type="image/x-icon">
    <script src="funcionamiento.js"></script>
</head>
<body>
    <div id="contenido">
        <!--canción-->
        <video poster="img/trailer.png" preload="metadata" muted width="500px" height="auto">
            <source src="videos/trailer.mp4" type="video/mp4">
            <source src="videos/trailer.ogv" type='"video/ogv; codecs="theora, vorbis"''>
            <source src="videos/trailer.webm" type='"video/webm"; codecs="vp8, vorbis"'>
        </video>
        <div id="botones-reproductor">
            <!--anterior-->
            <button class="boton" id="anteiror">
                <img src="img/bx-skip-previous.svg" alt="anteiror">
            </button>
            <!--play-->
            <button class="boton" id="play">
                <img src="img/bx-play.svg" alt="reproducir">
            </button>
            <!--pause-->
            <button class="boton" id="pause">
                <img src="img/bx-pause.svg" alt="pausar">
            </button>
            <!--siguiente-->
            <button class="boton" id="siguiente">
                <img src="img/bx-skip-next.svg" alt="siguiente">
            </button>
            <!--stop-->
            <button class="boton" id="stop">
                <img src="img/bx-stop.svg" alt="parar">
            </button>
            <!--reset-->
            <button class="boton" id="reset">
                <img src="img/bx-reset.svg" alt="resetear">
            </button>
            <!--volumen-->
            <button class="boton" id="volumen">
                <img src="img/bxs-volume-full.svg" alt="volumen">
            </button>
            <!-- control para deslizar la barra de volumen y baja o subir volumen 
                el step es como va subiendo o bajando -->
            <input type="range" value="10" min="0" max="100" step="10" id="barra-volumen">

        </div>
    </div>
</body>
</html>
