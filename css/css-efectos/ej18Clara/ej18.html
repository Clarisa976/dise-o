<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <h1>Ejemplo de tooltip</h1>
        <div class="tooltip-container">
            <span class="tooltip-trigger">Cloto hilaba</span>
            <div class="tooltip-content" id="primero">Representa el nacimiento</div>
        </div>

        <div class="tooltip-container">
            <span class="tooltip-trigger">Láquesis medía</span>
            <div class="tooltip-content" id="segundo">Representaba la vida</div>
        </div>

        <div class="tooltip-container">
            <span class="tooltip-trigger">Átropos cortaba</span>
            <div class="tooltip-content"id="tercero">Representa la muerte</div>
        </div>
    </main>


</body>

</html>
